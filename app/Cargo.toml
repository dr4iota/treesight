[package]
name = "treesight"
version = "0.1.0"
edition = "2024"
description = "Desktop shell for treeserve: a native window over the local server"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "treesight"
crate-type = ["lib"]

[build-dependencies]
tauri-build = "2"
treestamp = { path = "../stamp" }

[dependencies]
tauri = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# No `http`: the shell serves the same router through the webview's own
# protocol, so tiny_http and the socket it wants are not built at all.
treeserve = { path = "..", default-features = false, features = ["onig"] }
# Both halves of the stamp: the build script writes it, the crate reads it.
treestamp = { path = "../stamp" }

# Desktop only, and it does not build for mobile at all: there is no second
# launch to fold into the first when the system routes intents to the activity
# that is already running.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

# For `GetLogicalDrives`, which is the only way to ask which drive letters exist
# without asking the drives themselves. Already in the tree under tauri, so this
# is a name for something we were building anyway.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
