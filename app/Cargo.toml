[package]
name = "treesight"
version = "0.1.0"
edition = "2024"
description = "Desktop shell for treeserve: a native window over the local server"
license = "MIT OR Apache-2.0"
publish = false

# No library half. Everything this program is made of is in `treesight-shell`
# next door; what is left here is the part that cannot be a library — the
# tauri.conf.json, the icons, the capabilities, and the context the config is
# compiled into. Keeping the two apart is what lets a downstream app link the
# shell without also linking a second `tauri_build::build()`; see shell/Cargo.toml.

[build-dependencies]
tauri-build = "2"
treestamp = { path = "../stamp" }

[dependencies]
# For `generate_context!`, which is the whole reason this crate is not the library.
tauri = "2"
treesight-shell = { path = "../shell" }
# Both halves of the stamp: the build script writes it, `main` reads it.
treestamp = { path = "../stamp" }
